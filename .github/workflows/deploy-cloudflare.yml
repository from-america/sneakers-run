name: Deploy Sneakers Run to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://sneakers-run.pages.dev
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Verify before deployment
        run: npm test
      - name: Build Cloudflare Pages artifact
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/web --project-name=sneakers-run
